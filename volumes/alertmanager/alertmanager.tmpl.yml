# Template file, replace RELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID
# RENAME to alertmanager.yml
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  receiver: 'telegram'

receivers:
- name: 'telegram'
  telegram_configs:
  - bot_token: '[TELEGRAM_BOT_TOKEN}'   # example: 123456:ABC-DEF1234GHI
    chat_id: [TELEGRAM_CHAT_ID]         # example: 123456789
    parse_mode: 'HTML'
    message: |
      <b>[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}</b>
      Instance: {{ .CommonLabels.instance }}
      Severity: {{ .CommonLabels.severity }}
      {{ if .CommonAnnotations.description }}{{ .CommonAnnotations.description }}{{ end }}
